# Phone-mode Firefox over Tailscale (noVNC + native touch UI)
# Open: http://100.82.108.108:5000/  → phone.html
# Fallback Selkies UI: :3001
#
# Image notes:
# - Prefer local committed image `firefox-novnc-phone:local` (has x11vnc/novnc).

services:
  firefox:
    image: firefox-novnc-phone:local
    pull_policy: never
    container_name: firefox-novnc
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - PIXELFLUX_WAYLAND=false
      # Firefox hard-mins ~500px wide; 440 clipped the right edge.
      # 500×1086 keeps the same tall phone aspect as 440×956.
      - SELKIES_MANUAL_WIDTH=500
      - SELKIES_MANUAL_HEIGHT=1086
      - SELKIES_IS_MANUAL_RESOLUTION_MODE=true
      - NO_DECOR=true
      - WEB_PORT=5000
    volumes:
      - ./config:/config
      - ./phone-ui:/phone-ui:ro
      - ./custom-cont-init.d:/custom-cont-init.d:ro
      - ./custom-services.d:/custom-services.d:ro
    ports:
      - "${WEB_PORT:-5000}:5000"
      - "${SELKIES_PORT:-3001}:3001"
    shm_size: "1gb"
    restart: unless-stopped
