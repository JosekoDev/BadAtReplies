services:
  firefox:
    image: ghcr.io/linuxserver/firefox:latest
    container_name: firefox-remote-desktop
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Dynamic scaling: follow client viewport (CSS pixels) and stretch to fill
      - SELKIES_USE_CSS_SCALING=true
      - SELKIES_FORCE_ALIGNED_RESOLUTION=true
      - SELKIES_UI_SIDEBAR_SHOW_SCREEN_SETTINGS=true
      - SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN=true
      # Do not set SELKIES_MANUAL_WIDTH/HEIGHT — that locks resolution
    volumes:
      - ./config:/config
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    restart: unless-stopped
