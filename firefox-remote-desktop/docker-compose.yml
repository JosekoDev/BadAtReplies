services:
  firefox:
    image: ghcr.io/linuxserver/firefox:latest
    container_name: firefox-remote-desktop
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # X11 so manual resolution sticks
      - PIXELFLUX_WAYLAND=false
      # iPhone 17 Pro Max logical viewport (CSS points)
      - SELKIES_MANUAL_WIDTH=440
      - SELKIES_MANUAL_HEIGHT=956
      - SELKIES_IS_MANUAL_RESOLUTION_MODE=true
      - SELKIES_SCALING_DPI=160
      - NO_DECOR=true
      - SELKIES_UI_SIDEBAR_SHOW_SCREEN_SETTINGS=true
      - SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN=true
    volumes:
      - ./config:/config
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    restart: unless-stopped
