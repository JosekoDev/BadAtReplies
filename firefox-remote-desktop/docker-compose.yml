services:
  firefox:
    image: ghcr.io/linuxserver/firefox:latest
    container_name: firefox-remote-desktop
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    restart: unless-stopped
