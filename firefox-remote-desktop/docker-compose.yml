services:
  firefox:
    image: ghcr.io/linuxserver/firefox:latest
    container_name: firefox-remote-desktop
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Dynamic client-driven resolution (fits the phone viewport)
      - SELKIES_USE_CSS_SCALING=true
      - SELKIES_SCALING_DPI=192
      - SELKIES_UI_SIDEBAR_SHOW_KEYBOARD_BUTTON=true
      - SELKIES_UI_SIDEBAR_SHOW_TRACKPAD=true
      - SELKIES_UI_SIDEBAR_SHOW_SOFT_BUTTONS=true
      - SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN=true
      - SELKIES_UI_SHOW_SIDEBAR=true
    volumes:
      - ./config:/config
      - ./mobile/index.html:/usr/share/selkies/web/index.html:ro
      - ./mobile/mobile-enhancements.js:/usr/share/selkies/web/mobile-enhancements.js:ro
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    restart: unless-stopped
