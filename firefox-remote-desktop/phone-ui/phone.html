<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Firefox</title>
  <style>
    :root {
      --chrome-h: 52px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --bar: #121212;
      --ink: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; background: #000; color: var(--ink);
      width: 100%; height: 100%; overflow: hidden;
      touch-action: none;
      font-family: -apple-system, system-ui, "SF Pro Text", sans-serif;
    }
    #shell {
      position: fixed; inset: 0;
      display: grid;
      grid-template-rows: calc(var(--chrome-h) + var(--safe-top)) 1fr;
    }
    #topbar {
      display: flex; align-items: center; gap: 8px;
      padding: var(--safe-top) 10px 0;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      z-index: 5;
    }
    #topbar button {
      flex: 0 0 auto;
      width: 36px; height: 36px;
      border: 0; border-radius: 10px;
      background: #1c1c1e; color: var(--ink);
      font-size: 22px; line-height: 1;
    }
    #topbar button:active { background: #2c2c2e; }
    #url {
      flex: 1 1 auto;
      height: 36px;
      border: 0; border-radius: 10px;
      padding: 0 12px;
      background: #1c1c1e; color: var(--ink);
      font-size: 15px;
      outline: none;
    }
    #url::placeholder { color: var(--muted); }
    #screen-wrap {
      position: relative;
      min-height: 0;
      background: #000;
      overflow: hidden;
    }
    #screen {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Let noVNC set canvas CSS width/height for correct touch mapping */
    #screen > div {
      margin: 0 !important;
    }
    #status {
      position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
      color: #fff; font: 600 14px/1.3 -apple-system, system-ui, sans-serif;
      background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px;
      z-index: 10; pointer-events: none;
      transition: opacity .25s ease;
    }
    #status.hidden { opacity: 0; }
    #status.clickable { pointer-events: auto; }
    #hint {
      position: absolute; left: 12px; right: 12px;
      bottom: calc(12px + var(--safe-bot));
      color: rgba(255,255,255,.7); font: 12px/1.3 -apple-system, system-ui, sans-serif;
      text-align: center; pointer-events: none; z-index: 9;
      transition: opacity .4s ease;
    }
    #hint.hidden { opacity: 0; }
    #kb {
      position: absolute; left: 0; right: 0; bottom: 0;
      transform: translateY(110%);
      transition: transform .22s ease;
      background: var(--bar);
      border-top: 1px solid var(--line);
      padding: 10px 10px calc(10px + var(--safe-bot));
      z-index: 6;
    }
    #kb.open { transform: translateY(0); }
    #kb textarea {
      width: 100%; height: 72px; resize: none;
      border: 0; border-radius: 12px;
      padding: 10px 12px;
      background: #1c1c1e; color: var(--ink);
      font: 16px/1.35 -apple-system, system-ui, sans-serif;
      outline: none;
    }
    #kb .row {
      display: flex; gap: 8px; margin-top: 8px;
    }
    #kb .row button {
      flex: 1;
      height: 40px; border: 0; border-radius: 10px;
      background: #1c1c1e; color: var(--ink); font-size: 15px; font-weight: 600;
    }
    #kb .row button.primary { background: var(--accent); color: #fff; }
  </style>
  <script type="module" src="phone-app.js"></script>
</head>
<body>
  <div id="shell">
    <div id="topbar">
      <button id="back" type="button" aria-label="Back">‹</button>
      <input id="url" type="search" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Search Google or type a URL">
      <button id="go" type="button" aria-label="Go">Go</button>
      <button id="kbd" type="button" aria-label="Keyboard">⌨</button>
    </div>
    <div id="screen-wrap">
      <div id="status">Connecting…</div>
      <div id="screen"></div>
      <div id="hint">Use the search bar above · Tap to click · Swipe to scroll</div>
      <div id="kb">
        <textarea id="typebox" rows="3" placeholder="Type here, then Send"></textarea>
        <div class="row">
          <button id="kb-close" type="button">Close</button>
          <button id="kb-send" class="primary" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
